{% extends 'operations_portal/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block page_content %}
<div class="container-fluid">
  <div class="py-3 d-flex align-items-sm-center flex-sm-row flex-column">
    <div class="flex-grow-1">
      <h4 class="fs-18 fw-semibold m-0">{{ title }}</h4>
      <p class="text-muted mb-0 mt-1">{{ tenant_scope_note }}</p>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body text-center py-5">
          <div class="avatar-lg mx-auto mb-3 rounded-circle bg-primary-subtle d-flex align-items-center justify-content-center">
            <i data-feather="layout" class="text-primary"></i>
          </div>
          <h5 class="text-dark">{{ title }}</h5>
          <p class="text-muted mb-0">Esta área já está reservada no painel operacional e será conectada aos fluxos próprios da Lívia em uma próxima fase.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
